# Reference only: these services were created on Render through the dashboard/connector.
services:
  - type: web
    runtime: node
    name: small-town-golf-co-web
    region: virginia
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: small-town-golf-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://smalltowngolfco.com
databases:
  - name: small-town-golf-db
    region: virginia
    plan: basic-256mb
